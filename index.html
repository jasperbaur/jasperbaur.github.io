<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jasper Baur — Photographer &amp; Naturalist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --ink:#100f0e;--paper:#f6f4f0;--warm:#faf8f4;
      --rule:rgba(0,0,0,0.07);
      --serif:'DM Serif Display',Georgia,serif;
      --sans:'Inter','Helvetica Neue',sans-serif;
      --play:'Playfair Display',Georgia,serif;
    }
    html{scroll-behavior:smooth}
    body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden}
    /* nav */
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2.5rem;background:rgba(246,244,240,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
    .nav-logo{font-family:var(--serif);font-size:1.1rem;letter-spacing:.02em}
    .nav-links{list-style:none;display:flex;gap:2rem}
    .nav-links a{text-decoration:none;color:var(--ink);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;opacity:.7;transition:opacity .2s}
    .nav-links a:hover{opacity:1}
    .nav-cta{background:var(--ink);color:var(--paper);border:none;padding:.55rem 1.25rem;font-family:var(--sans);font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;transition:opacity .2s}
    .nav-cta:hover{opacity:.8}
    /* hero */
    .hero{position:relative;height:100svh;min-height:600px;display:flex;align-items:flex-end;overflow:hidden}
    .hero-bg{position:absolute;inset:0;z-index:0}
    .hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center}
    .hero-fade{position:absolute;inset:0;background:linear-gradient(to top,rgba(16,15,14,.72) 0%,rgba(16,15,14,.3) 45%,transparent 100%);z-index:1}
    .hero-content{position:relative;z-index:2;padding:3rem 3rem 5rem;max-width:780px}
    .hero-overline{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,244,240,.7);margin-bottom:1.5rem}
    .hero-title{font-family:var(--serif);font-size:clamp(3rem,8vw,6.5rem);line-height:.96;color:var(--paper);margin-bottom:1.75rem}
    .hero-title .ital{font-style:italic}
    .hero-intro{font-size:1.05rem;line-height:1.7;color:rgba(246,244,240,.85);max-width:520px;margin-bottom:2.25rem}
    .hero-cta-row{display:flex;gap:1.25rem;flex-wrap:wrap}
    .btn-white{background:var(--paper);color:var(--ink);padding:.65rem 1.5rem;text-decoration:none;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;transition:opacity .2s}
    .btn-white:hover{opacity:.8}
    .btn-arrow{color:var(--paper);text-decoration:none;font-size:.85rem;border-bottom:1px solid rgba(246,244,240,.4);padding-bottom:2px;transition:border-color .2s}
    .btn-arrow:hover{border-color:var(--paper)}
    .hero-credit{position:absolute;bottom:1.5rem;right:1.75rem;z-index:2;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(246,244,240,.45)}
    /* big-quote */
    .big-quote{padding:6rem 3rem;max-width:900px;margin:0 auto;text-align:center}
    .big-quote blockquote{font-family:var(--play);font-size:clamp(1.25rem,2.5vw,1.75rem);line-height:1.55;color:var(--ink);font-style:italic;margin-bottom:1.5rem}
    .big-quote cite{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.5}
    /* sec-label */
    .sec-label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-bottom:3rem}
    /* gallery */
    #work{padding:5rem 2.5rem 6rem}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.5px;background:var(--rule)}
    .gcell{position:relative;overflow:hidden;cursor:pointer;background:var(--paper);aspect-ratio:4/3}
    .gcell img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
    .gcell:hover img{transform:scale(1.03)}
    .cmeta{position:absolute;bottom:0;left:0;right:0;padding:1rem 1.25rem 1.25rem;background:linear-gradient(transparent,rgba(16,15,14,.65));color:var(--paper);opacity:0;transform:translateY(4px);transition:all .3s}
    .gcell:hover .cmeta{opacity:1;transform:translateY(0)}
    .ctitle{font-family:var(--serif);font-size:1rem;margin-bottom:.25rem}
    .ccap{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
    .cov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
    .gcell:hover .cov{opacity:1}
    .cov span{background:rgba(246,244,240,.15);backdrop-filter:blur(4px);color:var(--paper);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:.4rem 1rem;border:1px solid rgba(246,244,240,.3)}
    /* about */
    .about-split{display:grid;grid-template-columns:1fr 1fr;min-height:600px}
    .about-img img{width:100%;height:100%;object-fit:cover;object-position:center top}
    .about-text{padding:5rem 4rem;display:flex;flex-direction:column;justify-content:center;background:var(--warm)}
    .about-hed{font-family:var(--serif);font-size:clamp(2rem,3.5vw,3rem);line-height:1.08;margin-bottom:2rem}
    .about-p{font-size:.95rem;line-height:1.8;opacity:.8;margin-bottom:1.25rem}
    .skill-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.75rem}
    .stag{background:var(--ink);color:var(--paper);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .75rem}
    /* field log */
    #field{padding:5rem 2.5rem}
    .field-list{border-top:1px solid var(--rule)}
    .field-row{display:grid;grid-template-columns:80px 1fr auto;gap:1.5rem;padding:1.75rem 0;border-bottom:1px solid var(--rule);align-items:start}
    .fy{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.45;padding-top:.2rem}
    .fn{font-family:var(--serif);font-size:1.1rem;margin-bottom:.35rem}
    .fd{font-size:.85rem;opacity:.65;line-height:1.6}
    .fbadge{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .7rem;border:1px solid var(--rule);white-space:nowrap;opacity:.7}
    /* collaborate */
    #collaborate{padding:6rem 3rem;max-width:1100px;margin:0 auto}
    .collab-overline{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-bottom:2rem}
    .collab-hed{font-family:var(--serif);font-size:clamp(2.25rem,5vw,4rem);line-height:1.05;margin-bottom:2rem;max-width:700px}
    .collab-sub{font-size:1rem;line-height:1.75;opacity:.75;max-width:620px;margin-bottom:3.5rem}
    .offer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2.5rem;margin-bottom:3.5rem}
    .offer-who{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-bottom:.75rem}
    .offer-title{font-family:var(--serif);font-size:1.35rem;margin-bottom:.75rem}
    .offer-desc{font-size:.9rem;line-height:1.7;opacity:.75}
    .target-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:3rem;font-size:.85rem;opacity:.6}
    .ti{opacity:.5;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;margin-right:.5rem}
    .tn{font-family:var(--serif)}
    .td{opacity:.3}
    .cta-row{display:flex;gap:1.25rem;flex-wrap:wrap}
    .btn-light{background:var(--ink);color:var(--paper);padding:.65rem 1.75rem;text-decoration:none;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;transition:opacity .2s}
    .btn-light:hover{opacity:.8}
    .btn-ghost{border:1px solid var(--ink);color:var(--ink);padding:.65rem 1.75rem;text-decoration:none;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;transition:all .2s}
    .btn-ghost:hover{background:var(--ink);color:var(--paper)}
    /* footer */
    footer{padding:2.5rem 2.5rem;border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
    .footer-name{font-family:var(--serif);font-size:1rem}
    .footer-links{display:flex;gap:2rem;flex-wrap:wrap}
    .footer-links a,.footer-links span{font-size:.8rem;color:var(--ink);text-decoration:none;opacity:.6;letter-spacing:.04em}
    .footer-links a:hover{opacity:1}
    /* lightbox */
    .lightbox{position:fixed;inset:0;background:rgba(16,15,14,.95);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
    .lightbox.open{opacity:1;pointer-events:all}
    .lightbox img{max-width:90vw;max-height:80vh;object-fit:contain}
    .lb-close{position:absolute;top:1.5rem;right:2rem;background:none;border:none;color:var(--paper);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;opacity:.6;transition:opacity .2s}
    .lb-close:hover{opacity:1}
    .lb-cap{color:rgba(246,244,240,.6);font-size:.8rem;letter-spacing:.08em;margin-top:1.25rem}
    /* loading state */
    .loading{opacity:.4;pointer-events:none}
    @media(max-width:768px){
      nav{padding:1rem 1.25rem}
      .nav-links{display:none}
      .hero-content{padding:2rem 1.5rem 4rem}
      .about-split{grid-template-columns:1fr}
      .about-img{height:50vw}
      .about-text{padding:3rem 1.5rem}
      .field-row{grid-template-columns:60px 1fr;gap:1rem}
      .fbadge{display:none}
      #collaborate{padding:4rem 1.5rem}
      footer{flex-direction:column}
    }
  </style>
</head>
<body class="loading">

<nav>
  <div class="nav-logo" id="nav-logo">Jasper Baur</div>
  <ul class="nav-links">
    <li><a href="#work">Work</a></li>
    <li><a href="#field">Field</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#collaborate">Collaborate</a></li>
  </ul>
  <button class="nav-cta" onclick="document.getElementById('collaborate').scrollIntoView({behavior:'smooth'})">Work with me</button>
</nav>

<div class="hero" id="hero-section">
  <div class="hero-bg"><img id="hero-img" src="" alt="" loading="lazy"></div>
  <div class="hero-fade"></div>
  <div class="hero-content">
    <div class="hero-overline" id="hero-overline"></div>
    <h1 class="hero-title" id="hero-title"></h1>
    <p class="hero-intro" id="hero-intro"></p>
    <div class="hero-cta-row">
      <a href="#work" class="btn-white" id="hero-cta-work">See the work</a>
      <a href="#collaborate" class="btn-arrow" id="hero-cta-collab">Available for assignment →</a>
    </div>
  </div>
  <div class="hero-credit" id="hero-credit"></div>
</div>

<div class="big-quote" id="quote-section">
  <blockquote id="quote-text"></blockquote>
  <cite id="quote-cite"></cite>
</div>

<section id="work">
  <div class="sec-label">Selected work</div>
  <div class="gallery-grid" id="gallery-grid"></div>
</section>

<div class="about-split" id="about">
  <div class="about-img"><img id="about-img" src="" alt="" loading="lazy"></div>
  <div class="about-text">
    <div class="sec-label" style="margin-bottom:2rem">About</div>
    <h2 class="about-hed" id="about-hed"></h2>
    <div id="about-paras"></div>
    <div class="skill-row" id="skill-row"></div>
  </div>
</div>

<section id="field" style="background:var(--warm)">
  <div class="sec-label">Field log</div>
  <div class="field-list" id="field-list"></div>
</section>

<section id="collaborate">
  <div class="collab-overline" id="collab-overline"></div>
  <h2 class="collab-hed" id="collab-hed"></h2>
  <p class="collab-sub" id="collab-sub"></p>
  <div class="offer-grid" id="offer-grid"></div>
  <div class="target-row" id="target-row"></div>
  <div class="cta-row" id="cta-row"></div>
</section>

<footer>
  <div class="footer-name" id="footer-name"></div>
  <div class="footer-links" id="footer-links"></div>
</footer>

<div class="lightbox" id="lightbox" onclick="closeLb(event)">
  <button class="lb-close" onclick="document.getElementById('lightbox').classList.remove('open')">✕ close</button>
  <img id="lb-img" src="" alt="">
  <div class="lb-cap" id="lb-cap"></div>
</div>

<script>
  function openLight(cell) {
    const i = cell.querySelector('img');
    if (!i) return;
    document.getElementById('lb-img').src = i.src;
    document.getElementById('lb-cap').textContent = cell.dataset.caption || '';
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLb(e) {
    if (e.target === document.getElementById('lightbox'))
      document.getElementById('lightbox').classList.remove('open');
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
  });

  fetch('content.json')
    .then(r => r.json())
    .then(d => {
      document.title = d.site.title;

      // Hero
      const hi = document.getElementById('hero-img');
      hi.src = d.hero.image;
      hi.alt = d.hero.imageAlt;
      document.getElementById('hero-overline').textContent = d.hero.overline;
      document.getElementById('hero-title').innerHTML = d.hero.title;
      document.getElementById('hero-intro').textContent = d.hero.intro;
      document.getElementById('hero-credit').textContent = d.hero.credit;
      document.getElementById('hero-cta-work').textContent = d.hero.ctaWork;
      document.getElementById('hero-cta-collab').textContent = d.hero.ctaCollaborate;

      // Quote
      document.getElementById('quote-text').textContent = '"' + d.quote.text + '"';
      document.getElementById('quote-cite').textContent = d.quote.cite;

      // Gallery
      const gg = document.getElementById('gallery-grid');
      d.gallery.forEach(item => {
        const div = document.createElement('div');
        div.className = 'gcell';
        div.dataset.caption = item.dataCaption;
        div.onclick = function(){ openLight(this); };
        div.innerHTML = `<img src="${item.image}" alt="${item.alt}" loading="lazy">
          <div class="cmeta"><div class="ctitle">${item.title}</div><div class="ccap">${item.caption}</div></div>
          <div class="cov"><span>View</span></div>`;
        gg.appendChild(div);
      });

      // About
      const ai = document.getElementById('about-img');
      ai.src = d.about.image;
      ai.alt = d.about.imageAlt;
      document.getElementById('about-hed').innerHTML = d.about.heading;
      const ap = document.getElementById('about-paras');
      d.about.paragraphs.forEach(p => {
        const el = document.createElement('p');
        el.className = 'about-p';
        el.innerHTML = p;
        ap.appendChild(el);
      });
      const sr = document.getElementById('skill-row');
      d.about.skills.forEach(s => {
        const sp = document.createElement('span');
        sp.className = 'stag';
        sp.textContent = s;
        sr.appendChild(sp);
      });

      // Field log
      const fl = document.getElementById('field-list');
      d.fieldLog.forEach(row => {
        const div = document.createElement('div');
        div.className = 'field-row';
        div.innerHTML = `<div class="fy">${row.year}</div>
          <div><div class="fn">${row.name}</div><div class="fd">${row.description}</div></div>
          <span class="fbadge">${row.badge}</span>`;
        fl.appendChild(div);
      });

      // Collaborate
      const c = d.collaborate;
      document.getElementById('collab-overline').textContent = c.overline;
      document.getElementById('collab-hed').innerHTML = c.heading;
      document.getElementById('collab-sub').textContent = c.subtext;
      const og = document.getElementById('offer-grid');
      c.offers.forEach(o => {
        const div = document.createElement('div');
        div.className = 'offer-cell';
        div.innerHTML = `<div class="offer-who">${o.audience}</div>
          <div class="offer-title">${o.title}</div>
          <p class="offer-desc">${o.desc}</p>`;
        og.appendChild(div);
      });
      const tr = document.getElementById('target-row');
      tr.innerHTML = '<span class="ti">Seeking partnerships with</span>';
      c.partners.forEach((p, i) => {
        tr.innerHTML += `<span class="tn">${p}</span>`;
        if (i < c.partners.length - 1) tr.innerHTML += '<span class="td">·</span>';
      });
      const cr = document.getElementById('cta-row');
      cr.innerHTML = `<a href="mailto:${d.site.email}" class="btn-light">Get in touch</a>
        <a href="${d.site.instagram}" target="_blank" class="btn-ghost">${d.site.instagramHandle}</a>`;

      // Footer
      document.getElementById('footer-name').textContent = d.site.name;
      document.getElementById('footer-links').innerHTML = `
        <a href="${d.site.instagram}" target="_blank">${d.site.instagramHandle}</a>
        <a href="mailto:${d.site.email}">${d.site.email}</a>
        <span>${d.site.phone}</span>`;

      document.body.classList.remove('loading');
    })
    .catch(err => {
      console.error('Failed to load content.json:', err);
      document.body.classList.remove('loading');
      document.body.innerHTML = '<p style="padding:3rem;font-family:sans-serif">Error loading site content. Make sure content.json is in the same folder.</p>';
    });
</script>
</body>
</html>
