<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Jasper Baur — Photographer & Naturalist</title>
  <meta id="page-desc" name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --ink:#100f0e;--paper:#f6f4f0;--warm:#faf8f4;
      --rule:rgba(0,0,0,0.07);
      --serif:'DM Serif Display',Georgia,serif;
      --serif2:'Playfair Display',Georgia,serif;
      --sans:'Inter',system-ui,sans-serif;
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}

    nav{position:sticky;top:0;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:1.2rem 5vw;background:rgba(246,244,240,0.96);backdrop-filter:blur(16px);border-bottom:0.5px solid var(--rule)}
    .nav-logo{font-family:var(--serif);font-size:1.05rem}
    .nav-links{display:flex;gap:2.5rem;list-style:none}
    .nav-links a{text-decoration:none;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:#888;transition:color .2s}
    .nav-links a:hover{color:var(--ink)}
    .nav-cta{font-family:var(--sans);font-size:.67rem;letter-spacing:.13em;text-transform:uppercase;background:none;border:.8px solid var(--ink);padding:.48rem 1.2rem;cursor:pointer;transition:background .2s,color .2s}
    .nav-cta:hover{background:var(--ink);color:var(--paper)}

    .hero{position:relative;height:100vh;max-height:980px;min-height:600px;overflow:hidden}
    .hero-bg{position:absolute;inset:0}
    .hero-bg img{width:100%;height:100%;object-fit:cover;display:block}
    .hero-fade{position:absolute;inset:0;background:linear-gradient(105deg,rgba(8,8,6,.90) 0%,rgba(8,8,6,.60) 36%,rgba(8,8,6,.16) 62%,rgba(8,8,6,.0) 100%)}
    .hero-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 5vw 6vh;max-width:660px}
    .hero-overline{font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:1.5rem}
    .hero-title{font-family:var(--serif);font-size:clamp(4.2rem,7.5vw,9rem);font-weight:400;line-height:.88;letter-spacing:-.025em;color:#fff;margin-bottom:2rem}
    .hero-title .ital{font-style:italic;color:rgba(255,255,255,.48);display:block}
    .hero-intro{font-size:.9rem;line-height:1.85;color:rgba(255,255,255,.5);max-width:420px;margin-bottom:2.5rem}
    .hero-cta-row{display:flex;gap:1.2rem;align-items:center}
    .btn-white{font-family:var(--sans);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;background:rgba(255,255,255,.9);color:var(--ink);border:none;padding:.78rem 1.8rem;cursor:pointer;text-decoration:none;display:inline-block;transition:opacity .2s}
    .btn-white:hover{opacity:.85}
    .btn-arrow{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.35);text-decoration:none;transition:color .2s}
    .btn-arrow:hover{color:rgba(255,255,255,.8)}
    .hero-credit{position:absolute;bottom:1.2rem;right:1.5rem;font-size:.55rem;letter-spacing:.1em;color:rgba(255,255,255,.2)}

    .statement{background:var(--ink);color:var(--paper);padding:5rem 5vw;display:grid;grid-template-columns:1fr 2fr;gap:5rem;align-items:start}
    .statement-label{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.22);padding-top:.3rem}
    .statement-pull{font-family:var(--serif);font-size:clamp(1.6rem,2.8vw,2.6rem);font-weight:400;line-height:1.16;color:rgba(255,255,255,.88);margin-bottom:2rem}
    .statement-body p{font-size:.85rem;line-height:1.95;color:rgba(255,255,255,.4);margin-bottom:1.1rem;max-width:620px}
    .statement-body p:last-child{margin-bottom:0}

    section{padding:6rem 5vw}
    .sec-label{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:#c8c5be;display:flex;align-items:center;gap:1.5rem;margin-bottom:3.5rem}
    .sec-label::after{content:'';flex:1;height:.5px;background:var(--rule)}

    .gallery-grid{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:310px 310px;gap:3px}
    .gcell{position:relative;overflow:hidden;cursor:pointer}
    .gcell:first-child{grid-row:span 2}
    .gcell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .75s ease}
    .gcell:hover img{transform:scale(1.04)}
    .cmeta{position:absolute;bottom:0;left:0;right:0;padding:.9rem 1rem;background:linear-gradient(transparent,rgba(0,0,0,.62));z-index:1}
    .ctitle{font-family:var(--serif2);font-style:italic;font-size:.8rem;color:rgba(255,255,255,.8);margin-bottom:.1rem}
    .cov{position:absolute;inset:0;background:rgba(0,0,0,.25);opacity:0;transition:opacity .3s;display:flex;align-items:center;justify-content:center;z-index:2}
    .cov span{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:white;border:.5px solid rgba(255,255,255,.35);padding:.32rem .9rem}
    .gcell:hover .cov{opacity:1}

    .about-split{display:grid;grid-template-columns:1fr 1fr;min-height:600px}
    .about-img{overflow:hidden}
    .about-img img{width:100%;height:100%;object-fit:cover;display:block}
    .about-text{display:flex;flex-direction:column;justify-content:center;padding:5rem 5vw;background:var(--warm)}
    .about-hed{font-family:var(--serif);font-size:clamp(1.7rem,2.5vw,2.4rem);font-weight:400;line-height:1.2;margin-bottom:1.8rem}
    .about-hed em{font-style:italic;color:#999}
    .about-p{font-size:.875rem;line-height:2;color:#5a5857;margin-bottom:1.2rem}
    .skill-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.8rem}
    .stag{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;border:.5px solid rgba(0,0,0,.13);padding:.25rem .68rem;color:#888}

    .field-list{display:flex;flex-direction:column}
    .field-row{display:grid;grid-template-columns:68px 1fr auto;align-items:center;gap:2.5rem;padding:1.65rem 0;border-bottom:.5px solid var(--rule)}
    .field-row:first-child{border-top:.5px solid var(--rule)}
    .fy{font-size:.65rem;letter-spacing:.1em;color:#c0bdb8}
    .fn{font-family:var(--serif2);font-size:1.15rem;font-weight:400;margin-bottom:.22rem}
    .fd{font-size:.7rem;color:#aaa;line-height:1.6}
    .fbadge{font-size:.57rem;letter-spacing:.1em;text-transform:uppercase;border:.5px solid rgba(0,0,0,.12);padding:.22rem .6rem;color:#999;white-space:nowrap}

    #collaborate{background:var(--ink);color:var(--paper);padding:7rem 5vw}
    .collab-overline{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.18);margin-bottom:2rem}
    .collab-hed{font-family:var(--serif);font-size:clamp(2.6rem,5vw,5rem);font-weight:400;line-height:1.04;max-width:860px;margin-bottom:1.8rem}
    .collab-hed em{font-style:italic;color:rgba(255,255,255,.38)}
    .collab-sub{font-size:.88rem;line-height:1.9;color:rgba(255,255,255,.36);max-width:580px;margin-bottom:5rem}
    .offer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.06);margin-bottom:5rem}
    .offer-cell{background:var(--ink);padding:2.5rem 2rem}
    .offer-who{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.2);margin-bottom:1rem}
    .offer-title{font-family:var(--serif);font-size:1.35rem;font-style:italic;line-height:1.28;margin-bottom:1rem;color:rgba(255,255,255,.82)}
    .offer-desc{font-size:.77rem;line-height:1.85;color:rgba(255,255,255,.34)}
    .target-row{display:flex;align-items:center;gap:1.8rem;flex-wrap:wrap;margin-bottom:3.5rem;padding-bottom:3.5rem;border-bottom:.5px solid rgba(255,255,255,.06)}
    .ti{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.18)}
    .tn{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.44);font-weight:500}
    .td{color:rgba(255,255,255,.08)}
    .cta-row{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
    .btn-light{font-family:var(--sans);font-size:.67rem;letter-spacing:.13em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:none;padding:.88rem 2.2rem;cursor:pointer;text-decoration:none;display:inline-block;transition:opacity .2s}
    .btn-light:hover{opacity:.85}
    .btn-ghost{font-family:var(--sans);font-size:.67rem;letter-spacing:.13em;text-transform:uppercase;background:none;color:rgba(255,255,255,.36);border:.5px solid rgba(255,255,255,.14);padding:.88rem 2.2rem;cursor:pointer;text-decoration:none;display:inline-block;transition:border-color .2s,color .2s}
    .btn-ghost:hover{border-color:rgba(255,255,255,.46);color:rgba(255,255,255,.8)}

    .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:1000;align-items:center;justify-content:center;flex-direction:column}
    .lightbox.open{display:flex}
    .lightbox img{max-width:92vw;max-height:88vh;object-fit:contain}
    .lb-close{position:absolute;top:1.5rem;right:2rem;background:none;border:none;color:rgba(255,255,255,.32);font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
    .lb-cap{position:absolute;bottom:2rem;left:0;right:0;text-align:center;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.26)}

    footer{padding:1.8rem 5vw;display:flex;justify-content:space-between;align-items:center;border-top:.5px solid var(--rule)}
    .footer-name{font-family:var(--serif);font-size:.9rem}
    .footer-links{display:flex;gap:2rem;font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:#bbb}
    .footer-links a{color:inherit;text-decoration:none;transition:color .2s}
    .footer-links a:hover{color:var(--ink)}

    .big-quote{background:var(--ink);padding:7rem 5vw;display:flex;flex-direction:column;align-items:center;text-align:center}
    .big-quote blockquote{font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.8rem);font-style:italic;font-weight:400;line-height:1.35;color:rgba(255,255,255,0.88);max-width:860px;margin-bottom:2rem}
    .big-quote cite{font-family:var(--sans);font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.28);font-style:normal}

    @media(max-width:860px){
      .big-quote{padding:5rem 4vw}
      .big-quote blockquote{font-size:clamp(1.4rem,5.5vw,2rem)}
      nav{padding:1rem 4vw}.nav-links{display:none}
      .hero-title{font-size:clamp(3.2rem,11vw,5.5rem)}
      .statement{grid-template-columns:1fr;gap:1.5rem;padding:3.5rem 4vw}
      section{padding:4rem 4vw}
      .gallery-grid{grid-template-columns:1fr 1fr;grid-template-rows:220px 220px 220px}
      .gcell:first-child{grid-row:span 1;grid-column:span 2}
      .about-split{grid-template-columns:1fr}
      .about-img{height:65vw;min-height:280px}
      .field-row{grid-template-columns:52px 1fr}.fbadge{display:none}
      .offer-grid{grid-template-columns:1fr}
      #collaborate{padding:4rem 4vw}
      footer{flex-direction:column;gap:1.2rem;text-align:center}
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo" id="nav-logo">Jasper Baur</div>
  <ul class="nav-links">
    <li><a href="#work">Work</a></li>
    <li><a href="#field">Field</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#collaborate">Collaborate</a></li>
  </ul>
  <button class="nav-cta" onclick="document.getElementById('collaborate').scrollIntoView({behavior:'smooth'})">Work with me</button>
</nav>

<div class="hero" id="hero-section">
  <div class="hero-bg"><img id="hero-img" src="" alt="" loading="eager"></div>
  <div class="hero-fade"></div>
  <div class="hero-content">
    <div class="hero-overline" id="hero-overline"></div>
    <h1 class="hero-title" id="hero-title"></h1>
    <p class="hero-intro" id="hero-intro"></p>
    <div class="hero-cta-row" id="hero-ctas"></div>
  </div>
  <div class="hero-credit" id="hero-credit"></div>
</div>

<div class="statement" id="statement-section">
  <div class="statement-label" id="stmt-label"></div>
  <div class="statement-body">
    <p class="statement-pull" id="stmt-pull"></p>
    <div id="stmt-paras"></div>
  </div>
</div>

<section id="work">
  <div class="sec-label">Selected work</div>
  <div class="gallery-grid" id="gallery-grid"></div>
</section>

<div class="about-split" id="about">
  <div class="about-img"><img id="about-img" src="" alt=""></div>
  <div class="about-text">
    <h2 class="about-hed" id="about-hed"></h2>
    <div id="about-paras"></div>
    <div class="skill-row" id="skill-row"></div>
  </div>
</div>

<div class="big-quote" id="big-quote">
  <blockquote id="quote-text"></blockquote>
  <cite id="quote-cite"></cite>
</div>

<section id="field">
  <div class="sec-label">Field projects</div>
  <div class="field-list" id="field-list"></div>
</section>

<section id="collaborate">
  <div class="collab-overline" id="collab-overline"></div>
  <h2 class="collab-hed" id="collab-hed"></h2>
  <p class="collab-sub" id="collab-sub"></p>
  <div class="offer-grid" id="offer-grid"></div>
  <div class="target-row" id="target-row"></div>
  <div class="cta-row" id="cta-row"></div>
</section>

<footer>
  <div class="footer-name" id="footer-name"></div>
  <div class="footer-links" id="footer-links"></div>
</footer>

<div class="lightbox" id="lightbox" onclick="closeLb(event)">
  <button class="lb-close" onclick="document.getElementById('lightbox').classList.remove('open')">✕ close</button>
  <img id="lb-img" src="" alt="">
  <div class="lb-cap" id="lb-cap"></div>
</div>

<script>
async function loadContent() {
  const r = await fetch('content.json');
  const d = await r.json();

  // Site meta
  document.title = d.site.title;
  document.getElementById('page-desc').content = d.site.description;

  // Nav
  document.getElementById('nav-logo').textContent = d.site.name;

  // Hero
  const hi = d.hero || {};
  if (hi.image) {
    document.getElementById('hero-img').src = hi.image.src || '';
    document.getElementById('hero-img').alt = hi.image.alt || '';
  }
  document.getElementById('hero-overline').textContent = hi.overline || '';
  document.getElementById('hero-title').innerHTML =
    `${hi.titleLine1||''}<br>${hi.titleLine2||''}<br><span class="ital">${hi.titleItalic||''}</span>`;
  document.getElementById('hero-intro').textContent = hi.intro || '';
  document.getElementById('hero-credit').textContent = hi.credit || '';
  if (hi.ctaPrimary && hi.ctaSecondary) {
    document.getElementById('hero-ctas').innerHTML =
      `<a href="${hi.ctaPrimary.href}" class="btn-white">${hi.ctaPrimary.label}</a>` +
      `<a href="${hi.ctaSecondary.href}" class="btn-arrow">${hi.ctaSecondary.label} →</a>`;
  }

  // Statement
  const st = d.statement || {};
  document.getElementById('stmt-label').textContent = st.label || '';
  document.getElementById('stmt-pull').textContent = st.pull || '';
  document.getElementById('stmt-paras').innerHTML =
    (st.paragraphs || []).map(p => `<p>${p}</p>`).join('');

  // Gallery — built from projects (cover photo + title), falls back to d.gallery
  const gg = document.getElementById('gallery-grid');
  const galleryItems = (d.projects && d.projects.length)
    ? d.projects.map(p => ({
        src: (p.photos && p.photos.length) ? (p.photos[0].src || p.photos[0].url || '') : '',
        alt: (p.photos && p.photos.length) ? (p.photos[0].alt || p.title) : p.title,
        caption: p.title,
        slug: p.slug || ''
      }))
    : (d.gallery || []);
  galleryItems.forEach((img) => {
    const cell = document.createElement('div');
    cell.className = 'gcell';
    cell.dataset.caption = img.caption;
    cell.setAttribute('onclick', 'openLight(this)');
    cell.innerHTML = `
      <img src="${img.src}" alt="${img.alt}" loading="lazy">
      <div class="cmeta"><div class="ctitle">${img.caption}</div></div>
      <div class="cov"><span>View</span></div>`;
    gg.appendChild(cell);
  });

  // About
  const ab = d.about || {};
  if (ab.image) {
    document.getElementById('about-img').src = ab.image.src || '';
    document.getElementById('about-img').alt = ab.image.alt || '';
  }
  if (ab.headline) {
    const lines = ab.headline.split('\n');
    const lastLine = lines.pop();
    document.getElementById('about-hed').innerHTML =
      lines.map(l => l + '<br>').join('') + `<em>${lastLine}</em>`;
  }
  document.getElementById('about-paras').innerHTML =
    (ab.paragraphs || []).map(p => `<p class="about-p">${p}</p>`).join('');
  document.getElementById('skill-row').innerHTML =
    (ab.skills || []).map(s => `<span class="stag">${s}</span>`).join('');

  // Quote
  const qt = d.quote || {};
  document.getElementById('quote-text').textContent = qt.text || '';
  document.getElementById('quote-cite').textContent = qt.attribution || '';

  // Field work
  const fl = document.getElementById('field-list');
  d.fieldwork.forEach(fw => {
    fl.innerHTML += `
      <div class="field-row">
        <div class="fy">${fw.year}</div>
        <div><div class="fn">${fw.name}</div><div class="fd">${fw.description}</div></div>
        <span class="fbadge">${fw.badge}</span>
      </div>`;
  });

  // Collaborate
  const co = d.collaborate || {};
  document.getElementById('collab-overline').textContent = co.overline || '';
  document.getElementById('collab-hed').innerHTML =
    `${co.headline||''}<br><em>${co.headlineEmphasis||''}</em>`;
  document.getElementById('collab-sub').textContent = co.subtext || '';

  const og = document.getElementById('offer-grid');
  (co.offers || []).forEach(o => {
    og.innerHTML += `
      <div class="offer-cell">
        <div class="offer-who">${o.audience}</div>
        <div class="offer-title">${o.title}</div>
        <p class="offer-desc">${o.description}</p>
      </div>`;
  });

  const tr = document.getElementById('target-row');
  const partners = co.seekingPartners || [];
  tr.innerHTML = partners.length ? `<span class="ti">Seeking partnerships with</span>` +
    partners.map((b, i) =>
      `<span class="tn">${b}</span>` + (i < partners.length - 1 ? '<span class="td">·</span>' : '')
    ).join('') : '';

  const site = d.site;
  document.getElementById('cta-row').innerHTML =
    `<a href="mailto:${site.email}" class="btn-light">Get in touch</a>` +
    `<a href="${site.instagram}" target="_blank" class="btn-ghost">${site.instagramHandle}</a>`;

  // Footer
  document.getElementById('footer-name').textContent = d.site.name;
  document.getElementById('footer-links').innerHTML =
    `<a href="${site.instagram}" target="_blank">${site.instagramHandle}</a>` +
    `<a href="mailto:${site.email}">${site.email}</a>` +
    `<span>${site.phone}</span>`;
}

function openLight(cell) {
  const i = cell.querySelector('img');
  if (!i) return;
  document.getElementById('lb-img').src = i.src;
  document.getElementById('lb-cap').textContent = cell.dataset.caption || '';
  document.getElementById('lightbox').classList.add('open');
}
function closeLb(e) {
  if (e.target === document.getElementById('lightbox'))
    document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

loadContent();
</script>
</body>
</html>
